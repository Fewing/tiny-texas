<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tiny Texas{% endblock %}</title>
    <meta name="theme-color" content="#080e18">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/site.css') }}?v=20261114-1">
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ '/lobby' if current_user else '/' }}"><span aria-hidden="true">♠</span> Tiny Texas</a>
      {% block toolbar %}{% endblock %}
      <nav class="nav" aria-label="主导航">
        {% if current_user %}
          <a href="/lobby">大厅</a>
          <span class="user-pill">{{ current_user.username }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="ghost-button" type="submit">退出登录</button>
          </form>
        {% else %}
          <a href="/login">登录</a>
          <a class="primary-link" href="/register">注册</a>
        {% endif %}
      </nav>
    </header>
    <main class="page {% block page_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
